[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "llm-metrics"
dynamic = ["version"]
description = "Trace LLM calls with a decorator — non-blocking, fail-silent observability SDK."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
license-files = ["LICENSE"]
authors = [{ name = "Aaditya Sinha", email = "aadityasinha009@gmail.com" }]
keywords = ["llm", "observability", "tracing", "openai", "anthropic", "langchain"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]

# Rule: zero required runtime dependencies beyond httpx.
dependencies = ["httpx>=0.23,<1.0"]

[project.optional-dependencies]
openai = ["openai>=1.0"]
anthropic = ["anthropic>=0.30"]
langchain = ["langchain-core>=0.1"]
dev = [
    "anthropic>=0.30",
    "langchain-core>=0.1",
    "openai>=1.0",
    "pytest>=7.4",
    "pytest-asyncio>=0.21",
    "mypy>=1.8",
    "ruff>=0.4",
]

[project.urls]
Homepage = "https://github.com/aadityasinha-dotcom/llm-metrics"
Issues = "https://github.com/aadityasinha-dotcom/llm-metrics/issues"
Changelog = "https://github.com/aadityasinha-dotcom/llm-metrics/blob/main/CHANGELOG.md"

[tool.hatch.version]
path = "llm_metrics/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["llm_metrics"]

[tool.hatch.build.targets.sdist]
include = ["llm_metrics", "tests", "scripts", "Makefile", "README.md", "CLAUDE.md"]

# --------------------------------------------------------------------------- #
# ruff
# --------------------------------------------------------------------------- #
[tool.ruff]
line-length = 100
target-version = "py39"
src = ["llm_metrics", "tests"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "B",    # flake8-bugbear
    "BLE",  # flake8-blind-except — rule 2 requires broad excepts; make each one
            # an explicit, reviewed `noqa` rather than a habit
    "C4",   # flake8-comprehensions
    "UP",   # pyupgrade
    "SIM",  # flake8-simplify
    "RUF",  # ruff-specific
    "ANN",  # flake8-annotations
    "PT",   # flake8-pytest-style
    "TID",  # flake8-tidy-imports
]
ignore = [
    "ANN401",  # Any is legitimate for user metadata / LLM payloads
    "B008",    # function call in default argument
]

[tool.ruff.lint.per-file-ignores]
# Tests may use asserts, magic numbers, and untyped fixtures freely.
"tests/*" = ["ANN", "S101"]

[tool.ruff.lint.isort]
known-first-party = ["llm_metrics"]

[tool.ruff.format]
quote-style = "double"

# --------------------------------------------------------------------------- #
# mypy
# --------------------------------------------------------------------------- #
[tool.mypy]
# No `python_version` pin: current mypy refuses to target 3.9, and the 3.9 floor
# is already enforced by ruff's `target-version = "py39"`. Every module uses
# `from __future__ import annotations`, so PEP 604 unions are strings at runtime
# and stay valid on 3.9.
strict = true
warn_unreachable = true
disallow_any_generics = true
no_implicit_reexport = true
show_error_codes = true
files = ["llm_metrics", "tests", "scripts"]

[[tool.mypy.overrides]]
# Optional integration deps are not installed in every environment.
module = ["openai.*", "anthropic.*", "langchain_core.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false

# --------------------------------------------------------------------------- #
# pytest
# --------------------------------------------------------------------------- #
[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config"
markers = [
    "slow: tests that intentionally sleep to exercise timing behaviour",
]
filterwarnings = ["error"]
